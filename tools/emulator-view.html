<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《アオイトリ / AOI TORI》 · REDMI Watch 5 官方 Vela 模拟器</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#08121b;color:#f6eedb;font:15px system-ui;min-height:100vh;display:grid;place-items:center}
  main{display:flex;align-items:center;gap:36px;padding:24px}
  .frame{width:372px;flex-shrink:0;padding:16px;background:#0e1f2d;border:2px solid #b89452;border-radius:48px;box-shadow:0 20px 70px #000a}
  .screen{width:336px;aspect-ratio:432/514;overflow:hidden;border-radius:34px;background:#000;position:relative;border:1px solid #7d6438}
  img{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer;touch-action:none;user-select:none}
  aside{max-width:340px}
  h1{font-size:22px;margin:0 0 10px;color:#f3cb78}
  p{line-height:1.7;color:#c7d8e6;margin:8px 0}
  strong{color:#ffffff}
  button{display:block;width:250px;margin:10px 0;padding:11px;border:1px solid #b89452;border-radius:8px;background:#163147;color:#f7eedc;font-size:15px;cursor:pointer}
  button:hover{background:#5c3a10;border-color:#e0b45c}
  #status,#audio-status{font-size:13px;min-height:24px;color:#f3d79e;white-space:pre-wrap}
  @media(max-width:740px){main{flex-direction:column;gap:20px;padding:16px}.frame{width:min(360px,calc(100vw - 32px))}.screen{width:100%;height:auto}aside{max-width:340px}}
</style>
<main>
  <div class="frame">
    <div class="screen"><img id="screen" alt="アオイトリ REDMI Watch 5 官方 Vela 模拟器实时画面"></div>
  </div>
  <aside>
    <h1>《アオイトリ / AOI TORI》</h1>
    <p><strong>REDMI Watch 5 · 432 × 514 R18 完整版</strong><br>直接点击表盘操作 · 上下拖动滚动长文 · 向右滑动返回/菜单。<br>章节选择、CG鉴赏、场景回想与 OP 位于「鉴赏模式」内。</p>
    <button onclick="command('start')">启动 / 打开 アオイトリ</button>
    <button onclick="command('wake')">唤醒 / 电源键</button>
    <button id="preview-sound">启用预览声音</button>
    <audio id="preview-audio" preload="none"></audio>
    <p id="audio-status">点击“启用预览声音”同步播放原作 BGM/OP</p>
    <p id="status">正在连接 Vela 模拟器…</p>
    <p>设备：AoiToriRW5 (432×514 · 128 MB RAM)<br>包名：com.antigravity.aoitori.rw5<br>运行时：官方 Xiaomi Vela 5.0 模拟器（非实机）。</p>
  </aside>
</main>
<script>
const screen = document.querySelector('#screen'), status = document.querySelector('#status');
let updating = false, identityOK = false, down = null;

async function verify() {
  const r = await fetch('/info');
  const i = await r.json();
  if (i.name !== 'AoiToriRW5' || i.packageName !== 'com.antigravity.aoitori.rw5') {
    throw Error('设备身份不符，已禁止操作');
  }
  identityOK = true;
  status.textContent = i.bootReady ? '已连接《アオイトリ》Vela 模拟器，可直接点击操作。' : '模拟器正在启动中…';
}

async function command(endpoint) {
  try {
    if (!identityOK) throw Error('设备身份尚未核实');
    const r = await fetch('/' + endpoint);
    const d = await r.json();
    if (!r.ok) throw Error(d.error || ('HTTP ' + r.status));
    status.textContent = typeof d === 'string' ? (d || '操作完成') : JSON.stringify(d);
  } catch (e) {
    status.textContent = e.message;
  }
}

const point = e => {
  const r = screen.getBoundingClientRect();
  const w = screen.naturalWidth || 432;
  const h = screen.naturalHeight || 514;
  return {
    x: Math.max(0, Math.min(w - 1, Math.round((e.clientX - r.left) * w / r.width))),
    y: Math.max(0, Math.min(h - 1, Math.round((e.clientY - r.top) * h / r.height))),
  };
};

screen.addEventListener('pointerdown', e => {
  if (!identityOK) return;
  down = point(e);
  screen.setPointerCapture(e.pointerId);
});

screen.addEventListener('pointerup', async e => {
  if (!down) return;
  const end = point(e), start = down;
  down = null;
  if (Math.hypot(end.x - start.x, end.y - start.y) > 8) {
    await command(`drag?x0=${start.x}&y0=${start.y}&x1=${end.x}&y1=${end.y}`);
  } else {
    await command(`click?x=${end.x}&y=${end.y}`);
  }
});

screen.addEventListener('dragstart', e => e.preventDefault());
screen.addEventListener('pointercancel', () => { down = null; });

async function refresh() {
  if (updating || !identityOK) return;
  updating = true;
  try {
    const r = await fetch('/screen?t=' + Date.now());
    if (!r.ok) { updating = false; return; }
    const u = URL.createObjectURL(await r.blob()), old = screen.src;
    screen.onload = () => { if (old && old.startsWith('blob:')) URL.revokeObjectURL(old); updating = false; };
    screen.onerror = () => { updating = false; };
    screen.src = u;
    status.textContent = '已连接《アオイトリ》Vela 模拟器 · 实时画面';
  } catch (e) {
    updating = false;
  }
}

verify().then(() => { setInterval(refresh, 350); refresh(); }).catch(e => { status.textContent = e.message; });
</script>
<script src="/emulator-audio-client.js"></script>
</html>
